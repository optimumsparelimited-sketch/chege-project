kind = "mobile"
previewPath = "/mobile-budget/"
title = "Budget Mobile"
description = "A mobile companion for the Family Budget app. Lets Chege and Lydiah log expenses on the go with a bottom-sheet form, view the dashboard with month totals and a budget ring, and see recent activity — all secured with the same Replit Auth used by the web app."
version = "1.0.0"
id = "artifacts/mobile-budget"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile-budget/" ]
localPort = 25707

[services.development]
run = "pnpm --filter @workspace/mobile-budget run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-budget", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile-budget", "run", "serve" ]

[services.env]
PORT = "25707"
BASE_PATH = "/mobile-budget/"
